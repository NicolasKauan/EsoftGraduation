cript id="data" type="application/json">[{"id": 118, "topic": "$ifNull", "block": "$ifNull", "question": "O que $ifNull cobre?", "code": null, "options": {"A": "Apenas arrays vazios", "B": "Apenas string vazia", "C": "Campos ausentes ou null", "D": "Somente zero"}, "answer": "C", "explanation": "Ausência e null acionam o fallback."}, {"id": 119, "topic": "$ifNull", "block": "$ifNull", "question": "Qual resultado de { $ifNull: [null, \"sem nota\"] }?", "code": null, "options": {"A": "sem nota", "B": "false", "C": "null", "D": "0"}, "answer": "A", "explanation": "O segundo argumento substitui o primeiro quando este é null."}, {"id": 120, "topic": "$ifNull", "block": "$ifNull", "question": "Qual é a finalidade principal de $ifNull neste caso: Tratar avaliações ausentes?", "code": null, "options": {"A": "Criar automaticamente um índice exclusivo", "B": "Apagar os documentos da coleção original", "C": "Converter a coleção em banco relacional", "D": "Transformar ou processar os dados segundo a expressão definida"}, "answer": "D", "explanation": "O operador executa a transformação solicitada; não cria índices nem apaga a origem."}, {"id": 121, "topic": "$ifNull", "block": "$ifNull", "question": "Em qual contexto é adequado aplicar $ifNull?", "code": null, "options": {"A": "Somente em comandos deleteMany", "B": "Em uma expressão ou estágio de agregação compatível", "C": "Exclusivamente ao criar índices", "D": "Somente dentro de findOne"}, "answer": "B", "explanation": "A aplicação depende da posição sintática: operadores de expressão ficam em estágios como $project; estágios são itens do pipeline."}, {"id": 122, "topic": "$ifNull", "block": "$ifNull", "question": "Ao montar o pipeline para Tratar avaliações ausentes, qual cuidado é essencial?", "code": null, "options": {"A": "Colocar sempre $limit como primeiro estágio", "B": "Descartar campos usados depois", "C": "Usar strings literais em toda referência", "D": "Preservar campos necessários aos próximos estágios"}, "answer": "D", "explanation": "Cada estágio recebe o resultado do anterior; campos removidos não podem ser usados depois."}, {"id": 123, "topic": "$ifNull", "block": "$ifNull", "question": "Qual é a referência correta ao valor do campo avaliacao numa expressão MongoDB?", "code": null, "options": {"A": "\"$$avaliacao\"", "B": "avaliacao: true", "C": "\"avaliacao\"", "D": "\"$avaliacao\""}, "answer": "D", "explanation": "O prefixo $ em uma string indica o valor do campo; sem ele a string é literal."}, {"id": 124, "topic": "$ifNull", "block": "$ifNull", "question": "Qual estratégia ajuda a conferir o resultado de $ifNull?", "code": null, "options": {"A": "Adicionar $out antes de validar", "B": "Excluir os dados e recriar a base", "C": "Remover todos os filtros", "D": "Executar primeiro um pipeline curto com $project e $limit"}, "answer": "D", "explanation": "Uma projeção pequena permite inspecionar valores intermediários sem gravar resultados."}, {"id": 125, "topic": "$ifNull", "block": "$ifNull", "question": "Qual afirmação sobre a ordem dos estágios é correta para Tratar avaliações ausentes?", "code": null, "options": {"A": "A ordem nunca altera a saída", "B": "$sort sempre deve ser o primeiro", "C": "A saída de um estágio alimenta o seguinte", "D": "$group preserva automaticamente todos os campos"}, "answer": "C", "explanation": "A ordem importa: um agrupamento ou projeção pode alterar o formato dos documentos."}, {"id": 126, "topic": "$ifNull", "block": "$ifNull", "question": "Ao trabalhar com avaliacao no cenário proposto, qual é a melhor verificação inicial?", "code": null, "options": {"A": "Converter todos os valores em ObjectId", "B": "Conferir tipo e presença do campo nos documentos", "C": "Assumir que todos os valores são números", "D": "Remover documentos sem o campo"}, "answer": "B", "explanation": "Tipo, nulidade e estrutura dos dados condicionam o comportamento das expressões."}, {"id": 127, "topic": "$ifNull", "block": "$ifNull", "question": "Se um $project por const TOPIC="$ifNull", ORIGINAL=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);$('heading').textContent='Quiz — '+TOPIC;let qs=[],i=0,student='',turma='',started='',answers=[];function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function el(t,cl,txt){let x=document.createElement(t);if(cl)x.className=cl;if(txt!==undefined)x.textContent=txt;return x}function show(id){['start','exam','result'].forEach(k=>$(k).classList.toggle('hidden',k!==id))}$('begin').onclick=()=>{student=$('name').value.trim();turma=$('classroom').value.trim();if(!student||!turma){alert('Informe nome e turma.');return}started=new Date().toLocaleString('pt-BR');qs=shuffle(ORIGINAL).map(q=>({...q,opts:shuffle(Object.entries(q.options))}));answers=Array(qs.length).fill(null);i=0;show('exam');render()};function render(){let q=qs[i],root=$('question');root.replaceChildren();$('progress').textContent=`Questão ${i+1} de ${qs.length}`;$('fill').style.width=(100*(i+1)/qs.length)+'%';root.append(el('h3','',q.question));if(q.code)root.append(el('pre','',q.code));q.opts.forEach(([key,val],idx)=>{let b=el('button','option'+(answers[i]===key?' selected':''),String.fromCharCode(65+idx)+') '+val);b.onclick=()=>{answers[i]=key;render()};root.append(b)});let nav=el('div');if(i>0){let prev=el('button','','← Anterior');prev.onclick=()=>{i--;render()};nav.append(prev)}let next=el('button','primary',i===qs.length-1?'Finalizar avaliação':'Próxima →');next.style.marginLeft='10px';next.onclick=()=>{if(!answers[i]){alert('Selecione uma alternativa.');return}if(i<qs.length-1){i++;render()}else finish()};nav.append(next);root.append(nav)}function finish(){if(answers.some(a=>a===null)){alert('Responda todas as questões.');return}let correct=qs.reduce((n,q,j)=>n+(answers[j]===q.answer),0),grade=(10*correct/qs.length).toFixed(2).replace('.',','),end=new Date().toLocaleString('pt-BR');show('result');let root=$('result');root.replaceChildren();root.append(el('h2','','Comprovante de conclusão'));[['Aluno',student],['Turma',turma],['Assunto',TOPIC],['Início',started],['Término',end],['Acertos',correct+' de '+qs.length],['Nota',grade+' / 10']].forEach(([a,b])=>root.append(el('p','',a+': '+b)));let btn=el('button','primary no-print','Imprimir / Salvar PDF');btn.onclick=()=>window.print();root.append(btn);root.append(el('p','','Atenção: este HTML funciona offline e não envia notas automaticamente ao professor.'))}
