<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AVALIAÇÃO</title><style>body{font-family:Arial,sans-serif;background:#eef4f1;color:#001e2b;margin:0}header{background:#001e2b;color:white;padding:24px;text-align:center}main{max-width:780px;margin:22px auto;padding:0 15px}.card{background:white;padding:25px;border-radius:14px;box-shadow:0 5px 18px #0001;margin-bottom:15px}button{padding:12px 16px;border:1px solid #00684a;border-radius:8px;background:white;color:#004d39;cursor:pointer;font-size:15px}button.primary{background:#00684a;color:white}button.option{display:block;width:100%;text-align:left;margin:10px 0}button.selected{background:#c7f1dd}input{padding:12px;width:95%;margin:6px 0 14px;border:1px solid #aaa;border-radius:8px}pre{white-space:pre-wrap;background:#001e2b;color:#d1f9df;padding:15px;border-radius:8px}small{color:#63726d}.hidden{display:none}.bar{background:#ddd;height:8px;border-radius:8px}.fill{height:8px;background:#00a66c;border-radius:8px}footer{font-size:12px;text-align:center;padding:15px;color:#52645b}@media print{button,.no-print{display:none!important}body{background:white}}</style><header><h2 id="heading"></h2><p>StreamTech • Banco de Dados NoSQL • Avaliação individual</p></header><main><section class="card" id="start"><h3>Identificação</h3><label>Nome completo<input id="name" required></label><label>Turma<input id="classroom" required></label><p>15 questões • Nota de 0 a 10 • Uma alternativa por questão. A correção não será exibida.</p><button class="primary" id="begin">Iniciar avaliação</button></section><section id="exam" class="hidden"><div class="card"><span id="progress"></span><div class="bar"><div class="fill" id="fill"></div></div></div><div class="card" id="question"></div></section><section class="card hidden" id="result"></section></main><footer>Avaliação executada localmente no navegador. O comprovante não constitui registro autenticado.</footer><script id="data" type="application/json">[{"id": 43, "topic": "$dateToString", "block": "$dateToString", "question": "Qual formato produz ano e mês como 2026-09?", "code": null, "options": {"A": "%d/%m/%Y", "B": "%Y-%m", "C": "%H:%M", "D": "%w"}, "answer": "B", "explanation": "Os especificadores %Y e %m representam ano e mês."}, {"id": 44, "topic": "$dateToString", "block": "$dateToString", "question": "Em { $dateToString: { format: \"%H\", date: \"$dataHora\" } }, a hora é retornada como:", "code": null, "options": {"A": "Booleano", "B": "Número inteiro", "C": "String com dois dígitos", "D": "Data ISODate"}, "answer": "C", "explanation": "O operador formata uma data como string."}, {"id": 45, "topic": "$dateToString", "block": "$dateToString", "question": "Qual é a finalidade principal de $dateToString neste caso: Agrupar visualizações por mês?", "code": null, "options": {"A": "Apagar os documentos da coleção original", "B": "Converter a coleção em banco relacional", "C": "Transformar ou processar os dados segundo a expressão definida", "D": "Criar automaticamente um índice exclusivo"}, "answer": "C", "explanation": "O operador executa a transformação solicitada; não cria índices nem apaga a origem."}, {"id": 46, "topic": "$dateToString", "block": "$dateToString", "question": "Em qual contexto é adequado aplicar $dateToString?", "code": null, "options": {"A": "Em uma expressão ou estágio de agregação compatível", "B": "Exclusivamente ao criar índices", "C": "Somente dentro de findOne", "D": "Somente em comandos deleteMany"}, "answer": "A", "explanation": "A aplicação depende da posição sintática: operadores de expressão ficam em estágios como $project; estágios são itens do pipeline."}, {"id": 47, "topic": "$dateToString", "block": "$dateToString", "question": "Ao montar o pipeline para Agrupar visualizações por mês, qual cuidado é essencial?", "code": null, "options": {"A": "Descartar campos usados depois", "B": "Usar strings literais em toda referência", "C": "Preservar campos necessários aos próximos estágios", "D": "Colocar sempre $limit como primeiro estágio"}, "answer": "C", "explanation": "Cada estágio recebe o resultado do anterior; campos removidos não podem ser usados depois."}, {"id": 48, "topic": "$dateToString", "block": "$dateToString", "question": "Qual é a referência correta ao valor do campo dataHora numa expressão MongoDB?", "code": null, "options": {"A": "dataHora: true", "B": "\"dataHora\"", "C": "\"$dataHora\"", "D": "\"$$dataHora\""}, "answer": "C", "explanation": "O prefixo $ em uma string indica o valor do campo; sem ele a string é literal."}, {"id": 49, "topic": "$dateToString", "block": "$dateToString", "question": "Qual estratégia ajuda a conferir o resultado de $dateToString?", "code": null, "options": {"A": "Excluir os dados e recriar a base", "B": "Remover todos os filtros", "C": "Executar primeiro um pipeline curto com $project e $limit", "D": "Adicionar $out antes de validar"}, "answer": "C", "explanation": "Uma projeção pequena permite inspecionar valores intermediários sem gravar resultados."}, {"id": 50, "topic": "$dateToString", "block": "$dateToString", "question": "Qual afirmação sobre a ordem dos estágios é correta para Agrupar visualizações por mês?", "code": null, "options": {"A": "$sort sempre deve ser o primeiro", "B": "A saída de um estágio alimenta o seguinte", "C": "$group preserva automaticamente todos os campos", "D": "A ordem nunca altera a saída"}, "answer": "B", "explanation": "A ordem importa: um agrupamento ou projeção pode alterar o formato dos documentos."}, {"id": 51, "topic": "$dateToString", "block": "$dateToString", "question": "Ao trabalhar com dataHora no cenário proposto, qual é a melhor verificação inicial?", "code": null, "options": {"A": "Conferir tipo e presença do campo nos documentos", "B": "Assumir que todos os valores são números", "C": "Remover documentos sem o campo", "D": "Converter todos os valores em ObjectId"}, "answer": "A", "explanation": "Tipo, nulidade e estrutura dos dados condicionam o comportamento das expressões."}, {"id": 52, "topic": "$dateToString", "block": "$dateToString", "question": "Se um $project por inclusão remover dataHora antes de $dateToString utilizá-lo, o que acontece?", "code": null, "options": {"A": "O pipeline vira uma consulta SQL", "B": "O campo reaparece automaticamente", "C": "O valor original não estará disponível naquele ponto", "D": "O MongoDB restaura o documento inicial"}, "answer": "C", "explanation": "Uma projeção por inclusão elimina campos não selecionados, salvo _id."}, {"id": 53, "topic": "$dateToString", "block": "$dateToString", "question": "Como testar uma solução de Agrupar visualizações por mês sem alterar a coleção de origem?", "code": null, "options": {"A": "Usar drop() antes do aggregate", "B": "Substituir aggregate por deleteMany", "C": "Executar apenas estágios de leitura e projeção", "D": "Incluir $merge na primeira posição"}, "answer": "C", "explanation": "Consultas agregadas sem estágios de escrita podem ser inspecionadas sem persistir alterações."}, {"id": 54, "topic": "$dateToString", "block": "$dateToString", "question": "Para interpretar uma expressão com $dateToString, o que deve ser identificado primeiro?", "code": null, "options": {"A": "Os valores de entrada e o formato esperado da saída", "B": "A quantidade de índices da coleção", "C": "O nome do servidor de aplicação", "D": "A cor do MongoDB Compass"}, "answer": "A", "explanation": "A leitura da entrada e da saída esperada permite avaliar a expressão."}, {"id": 55, "topic": "$dateToString", "block": "$dateToString", "question": "Qual abordagem é mais segura ao combinar $dateToString com outros operadores?", "code": null, "options": {"A": "Montar tudo de uma vez sem conferir", "B": "Verificar resultados intermediários e tipos", "C": "Assumir que null equivale a zero", "D": "Usar sempre $unwind em qualquer campo"}, "answer": "B", "explanation": "Validar etapas intermediárias ajuda a detectar incompatibilidades e campos ausentes."}, {"id": 56, "topic": "$dateToString", "block": "$dateToString", "question": "Para aplicar $dateToString em um relatório, o que a equipe deve documentar?", "code": null, "options": {"A": "A senha de administrador", "B": "Apenas o nome do banco", "C": "Somente a cor do dashboard", "D": "A regra de transformação e os campos de entrada/saída"}, "answer": "D", "explanation": "A regra e o esquema de saída tornam o relatório reproduzível."}, {"id": 57, "topic": "$dateToString", "block": "$dateToString", "question": "Qual é a consequência de escrever \"dataHora\" em vez de \"$dataHora\" dentro de uma expressão que espera o valor do campo?", "code": null, "options": {"A": "Conversão automática para número", "B": "Criação de variável let", "C": "Referência automática ao campo", "D": "Texto literal, não valor do documento"}, "answer": "D", "explanation": "Strings sem prefixo $ são valores literais."}]</script><script>
const TOPIC="$dateToString", ORIGINAL=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);$('heading').textContent='Quiz — '+TOPIC;let qs=[],i=0,student='',turma='',started='',answers=[];function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function el(t,cl,txt){let x=document.createElement(t);if(cl)x.className=cl;if(txt!==undefined)x.textContent=txt;return x}function show(id){['start','exam','result'].forEach(k=>$(k).classList.toggle('hidden',k!==id))}$('begin').onclick=()=>{student=$('name').value.trim();turma=$('classroom').value.trim();if(!student||!turma){alert('Informe nome e turma.');return}started=new Date().toLocaleString('pt-BR');qs=shuffle(ORIGINAL).map(q=>({...q,opts:shuffle(Object.entries(q.options))}));answers=Array(qs.length).fill(null);i=0;show('exam');render()};function render(){let q=qs[i],root=$('question');root.replaceChildren();$('progress').textContent=`Questão ${i+1} de ${qs.length}`;$('fill').style.width=(100*(i+1)/qs.length)+'%';root.append(el('h3','',q.question));if(q.code)root.append(el('pre','',q.code));q.opts.forEach(([key,val],idx)=>{let b=el('button','option'+(answers[i]===key?' selected':''),String.fromCharCode(65+idx)+') '+val);b.onclick=()=>{answers[i]=key;render()};root.append(b)});let nav=el('div');if(i>0){let prev=el('button','','← Anterior');prev.onclick=()=>{i--;render()};nav.append(prev)}let next=el('button','primary',i===qs.length-1?'Finalizar avaliação':'Próxima →');next.style.marginLeft='10px';next.onclick=()=>{if(!answers[i]){alert('Selecione uma alternativa.');return}if(i<qs.length-1){i++;render()}else finish()};nav.append(next);root.append(nav)}function finish(){if(answers.some(a=>a===null)){alert('Responda todas as questões.');return}let correct=qs.reduce((n,q,j)=>n+(answers[j]===q.answer),0),grade=(10*correct/qs.length).toFixed(2).replace('.',','),end=new Date().toLocaleString('pt-BR');show('result');let root=$('result');root.replaceChildren();root.append(el('h2','','Comprovante de conclusão'));[['Aluno',student],['Turma',turma],['Assunto',TOPIC],['Início',started],['Término',end],['Acertos',correct+' de '+qs.length],['Nota',grade+' / 10']].forEach(([a,b])=>root.append(el('p','',a+': '+b)));let btn=el('button','primary no-print','Imprimir / Salvar PDF');btn.onclick=()=>window.print();root.append(btn);root.append(el('p','','Atenção: este HTML funciona offline e não envia notas automaticamente ao professor.'))}
</script></html>
