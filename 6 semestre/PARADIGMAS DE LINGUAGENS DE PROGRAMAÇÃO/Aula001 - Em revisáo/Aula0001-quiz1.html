ra compacta operações que exigiriam formas mais extensas.","id":"question-expressividade","objectiveIds":["obj03"],"options":["É a disponibilidade de formas convenientes para especificar computações. Construções expressivas podem representar de maneira compacta operações que exigiriam formas mais extensas.","O conceito pode apoiar uma comparação fundamentada entre alternativas.","Sua aplicação deve considerar o domínio e os objetivos do software.","Basta memorizar o nome do conceito; contexto, objetivos e consequências não alteram sua análise."],"prompt":"Sobre “Expressividade”, é errado afirmar que:"},{"correctIndex":0,"feedback":"Confiabilidade: É a propriedade de um programa comportar-se de acordo com suas especificações em todas as condições consideradas. Verificação de tipos, manipulação de exceções, controle de aliasing, legibilidade e facilidade de escrita influenciam esse critério. Objetivos cobertos: obj03.","id":"question-confiabilidade","objectiveIds":["obj03"],"options":["Explicitar os requisitos do projeto e avaliar Confiabilidade: É a propriedade de um programa comportar-se de acordo com suas especificações em todas as condições consideradas. Verificação de tipos, manipulação de exceções, controle de aliasing, legibilidade e facilidade de escrita influenciam esse critério.","Repetir a escolha do projeto anterior sem verificar os requisitos atuais.","Adotar a alternativa mais recente apenas por ser tendência.","Decidir por preferência pessoal e justificar somente depois."],"prompt":"Em uma decisão profissional sobre tecnologia, qual atitude aplica melhor “Confiabilidade”?"},{"correctIndex":1,"feedback":"No cenário apresentado, o conceito central é Verificação de tipos. Consiste em testar a existência de erros de tipos por meio do compilador ou durante a execução. A detecção em tempo de compilação é indicada no material porque antecipa o erro e tende a reduzir o custo de correção.","id":"question-verificacao_tipos","objectiveIds":["obj03"],"options":["Razões para estudar conceitos de LP","Verificação de tipos","Domínios de Programação","Critérios de Avaliação de Linguagem"],"prompt":"Uma equipe assumiu um sistema difícil de manter e precisa decidir se conserva ou substitui a tecnologia principal. Qual conceito orienta melhor a discussão sobre “Verificação de tipos”?"},{"correctIndex":2,"feedback":"Manipulação de exceções: É a capacidade de interceptar erros ocorridos durante a execução, aplicar medidas corretivas e permitir que o programa prossiga quando isso for possível. Objetivos cobertos: obj03.","id":"question-manipulacao_excecoes","objectiveIds":["obj03"],"options":["O estudo de conceitos de linguagens de programação amplia a capacidade de expressar ideias, fundamenta a escolha de linguagens adequadas, facilita a aprendizagem de novas linguagens, melhora a compreensão da implementação e favorece o uso das linguagens já conhecidas.","São campos de aplicação com necessidades computacionais distintas. O material apresenta aplicações científicas, comerciais, de inteligência artificial, de programação de sistemas e Web, associando cada domínio a tipos de dados, estruturas, requisitos ou linguagens características.","É a capacidade de interceptar erros ocorridos durante a execução, aplicar medidas corretivas e permitir que o programa prossiga quando isso for possível.","São referências para examinar e comparar linguagens. Os critérios centrais apresentados são legibilidade, capacidade de escrita, confiabilidade e custo; portabilidade e generalidade aparecem como critérios adicionais."],"prompt":"Qual opção descreve melhor “Manipulação de exceções”?"},{"correctIndex":3,"feedback":"Aliasing (apelidos): É a possibilidade de dois ou mais nomes ou métodos de acesso referenciarem a mesma célula de memória. Uma alteração realizada por um acesso pode afetar o valor observado pelos demais, o que exige atenção quanto à confiabilidade. Objetivos cobertos: obj03.","id":"question-aliasing","objectiveIds":["obj03"],"options":["E  projeto e avaliar Portabilidade e generalidade: Portabilidade é a facilidade de mover programas de uma implementação para outra. Generalidade é a aplicabilidade de uma linguagem a uma ampla faixa de aplicações.","Adotar a alternativa mais recente apenas por ser tendência.","Decidir por preferência pessoal e justificar somente depois."],"prompt":"Em uma decisão profissional sobre tecnologia, qual atitude aplica melhor “Portabilidade e generalidade”?"}],"title":"Preliminares — Quiz 1 de 2"}</script>
  <script>
    const data = JSON.parse(document.getElementById("quiz-data").textContent);
    const form = document.getElementById("quiz");
    data.questions.forEach((question, questionIndex) => {
      const section = document.createElement("section");
      section.className = "question";
      const title = document.createElement("h2");
      title.textContent = `${questionIndex + 1}. ${question.prompt}`;
      section.appendChild(title);
      const objective = document.createElement("p");
      objective.className = "objective";
      objective.textContent = `Objetivos: ${question.objectiveIds.join(", ")}`;
      section.appendChild(objective);
      question.options.forEach((option, optionIndex) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = question.id;
        input.value = optionIndex;
        label.append(input, ` ${option}`);
        section.appendChild(label);
      });
      const feedback = document.createElement("p");
      feedback.className = "feedback";
      feedback.hidden = true;
      feedback.dataset.for = question.id;
      section.appendChild(feedback);
      form.appendChild(section);
    });
    document.getElementById("check").addEventListener("click", () => {
      let score = 0;
      data.questions.forEach((question) => {
        const selected = form.querySelector(`input[name="${question.id}"]:checked`);
        const correct = selected && Number(selected.value) === question.correctIndex;
        if (correct) score += 1;
        form.querySelectorAll(`input[name="${question.id}"]`).forEach(
          (input, optionIndex) => {
            const label = input.closest("label");
            label.classList.toggle(
              "answer-correct",
              optionIndex === question.correctIndex
            );
            label.classList.toggle(
              "answer-incorrect",
              input.checked && optionIndex !== question.correctIndex
            );
          }
        );
        const feedback = form.querySelector(`[data-for="${question.id}"]`);
        feedback.hidden = false;
        feedback.textContent = `${correct ? "Correto." : "Revise."} ${question.feedback}`;
      });
      document.getElementById("score").textContent =
        `Resultado: ${score} de ${data.questions.length}.`;
    });
  </script>
