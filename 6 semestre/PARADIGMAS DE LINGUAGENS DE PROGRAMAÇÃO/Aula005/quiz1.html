  <script id="quiz-data" type="application/json">{"questions":[{"correctIndex":0,"feedback":"Linguagens imperativas e arquitetura de von Neumann: Linguagens imperativas podem ser compreendidas como abstrações de uma arquitetura formada por memória e processador. Nesse contexto, variáveis abstraem o armazenamento manipulado pelas operações do programa. Objetivos relacionados: Relacionar variáveis de linguagens imperativas às abstrações de memória e processamento da arquitetura de von Neumann.; Caracterizar uma variável por nome, endereço, valor, tipo, tempo de vida e escopo.","id":"question-arquitetura_von_neumann","objectiveLabels":["Relacionar variáveis de linguagens imperativas às abstrações de memória e processamento da arquitetura de von Neumann.","Caracterizar uma variável por nome, endereço, valor, tipo, tempo de vida e escopo."],"options":["Linguagens imperativas podem ser compreendidas como abstrações de uma arquitetura formada por memória e processador. Nesse contexto, variáveis abstraem o armazenamento manipulado pelas operações do programa.","Nomes identificam entidades de um programa. Seu projeto envolve decisões como comprimento permitido, quantidade de caracteres significativos e diferenciação entre maiúsculas e minúsculas; nomes muito curtos podem ser pouco representativos.","Quando os nomes são case sensitive, diferenças entre letras maiúsculas e minúsculas distinguem identificadores. Essa escolha pode prejudicar a legibilidade porque nomes visualmente parecidos passam a representar entidades diferentes.","Palavras especiais ajudam a delimitar ou separar sentenças. Uma palavra chave possui significado especial em determinados contextos, enquanto uma palavra reservada não pode ser usada como nome. Uma quantidade excessiva de palavras reservadas pode dificultar seu uso."],"prompt":"Qual opção descreve melhor “Linguagens imperativas e arquitetura de von Neumann”?"},{"correctIndex":1,"feedback":"Nomes: Nomes identificam entidades de um programa. Seu projeto envolve decisões como comprimento permitido, quantidade de caracteres significativos e diferenciação entre maiúsculas e minúsculas; nomes muito curtos podem ser pouco representativos. Objetivos relacionados: Analisar questões de projeto para nomes, incluindo tamanho, diferenciação entre maiúsculas e minúsculas e palavras especiais.; Caracterizar uma variável por nome, endereço, valor, tipo, tempo de vida e escopo.","id":"question-nomes","objectiveLabels":["Analisar questões de projeto para nomes, incluindo tamanho, diferenciação entre maiúsculas e minúsculas e palavras especiais.","Caracterizar uma variável por nome, endereço, valor, tipo, tempo de vida e escopo."],"options":["Desconsiderar o contexto e repetir somente uma palavra da definição.","Relacionar Nomes às consequências observáveis, pois nomes identificam entidades de um programa. Seu projeto envolve decisões como comprimento permitido, quantidade de caracteres significativos e diferenciação entre maiúsculas e minúsculas; nomes muito curtos podem ser pouco representativos.","Substituir o conceito por qualquer outro sem comparar seus significados.","Usar o nome do conceito como resposta sem explicar suas consequências."],"prompt":"Ao analisar um exemplo da aula, como “Nomes” deve orientar a explicação?"},{"correctIndex":2,"feedback":"A afirmação errada reduz Case sensitive a memorização. Na aula, quando os nomes são case sensitive, diferenças entre letras maiúsculas e minúsculas distinguem identificadores. Essa escolha pode prejudicar a legibilidade porque nomes visualmente parecidos passam a representar entidades diferentes.","id":"question-case_sensitive","objectiveLabels":["Analisar questões de projeto para nomes, incluindo tamanho, diferenciação entre maiúsculas e minúsculas e palavras especiais."],"options":["Quando os nomes são case sensitive, diferenças entre letras maiúsculas e minúsculas distinguem identificadores. Essa escolha pode prejudicar a legibilidade porque nomes visualmente parecidos passam a representar entidades diferentes.","O conceito pode ser relacionado aos objetivos e a exemplos da aula.","Basta memorizar o nome do conceito; contexto, objetivos e consequências não alteram sua análise.","Uma explicação adequada distingue o conceito de ideias próximas."],"prompt":"Sobre “Case sensitive”, é errado afirmar que:"},{"correctIndex":3,"feedback":"Palavras especiais: Palavras especiais ajudam a delimitar ou separar sentenças. Uma palavra chave possui significado especial em determinados contextos, enquanto uma palavra reservada não pode ser usada como nome. Uma quantidade excessiva de palavras reservadas pode dificultar seu uso. Objetivos relacionados: Analisar questões de projeto para nomes, incluindo tamanho, diferenciação entre maiúsculas e minúsculas e palavras especiais.","id":"question-palavras_especiais","objectiveLabels":["Analisar questões de projeto para nomes, incluindo tamanho, diferenciação entre maiúsculas e minúsculas e palavras especiais."],"options":["Misturar conceitos diferentes e observar apenas a conclusão final.","Escolher um exemplo sem explicar sua relação com o conceito.","Memorizar a definição e dispensar exemplos ou justificativas.","Definir Palavras especiais, aplicá-lo a um exemplo e justificar a análise: Palavras especiais ajudam a delimitar ou separar sentenças. Uma palavra chave possui significado especial em determinados contextos, enquanto uma palavra reservada não pode ser usada como nome. Uma quantidade excessiva de palavras reservadas pode dificultar seu uso."],"prompt":"Qual procedimento demonstra melhor a compreensão de “Palavras especiais”?"},{"correctIndex":0,"feedback":"No cenário apresentado, o conceito central é Variável. Uma variável é uma abstração de uma célula de memória ou de um conjunto de células. Ela é caracterizada pela sextupla nome, endereço, valor, tipo, tempo de vida e escopo.","id":"question-variavel","objectiveLabels":["Relacionar variáveis de linguagens imperativas às abstrações de memória e processamento da arquitetura de von Neumann.","Caracterizar uma variável por nome, endereço, valor, tipo, tempo de vida e escopo."],"options":["Variável","Linguagens imperativas e arquitetura de von Neumann","Nomes","Case sensitive"],"prompt":"Em uma revisão dos conceitos, qual conceito corresponde a esta descrição: “Uma variável é uma abstração de uma célula de memória ou de um conjunto de células. Ela é caracterizada pela sextupla nome, endereço, valor, tipo, tempo de vida e escopo.”?"},{"correctIndex":1,"feedback":"Atributos das variáveis: O nome identifica a variável, embora nem toda variável tenha nome. O endereço é a posição de memória associada a ela; o valor é o conteúdo dessa posição; e o tipo determina a faixa de valores, os operadores aplicáveis e, em ponto flutuante, a precisão. Em uma atribuição, a ocorrência da variável à esquerda designa o endereço, enquanto a ocorrência à direita fornece o valor. Objetivos relacionados: Caracterizar uma variável por nome, endereço, valor, tipo, tempo de vida e escopo.","id":"question-atributos_variavel","objectiveLabels":["Caracterizar uma variável por nome, endereço, valor, tipo, tempo de vida e escopo."],"options":["Linguagens imperativas podem ser compreendidas como abstrações de uma arquitetura formada por memória e processador. Nesse contexto, variáveis abstraem o armazenamento manipulado pelas operações do programa.","O nome identifica a variável, embora nem toda variável tenha nome. O endereço é a posição de memória associada a ela; o valor é o conteúdo dessa posição; e o tipo determina a faixa de valores, os operadores aplicáveis e, em ponto flutuante, a precisão. Em uma atribuição, a ocorrência da variável à esquerda designa o endereço, enquanto a ocorrência à direita fornece o valor.","Nomes identificam entidades de um programa. Seu projeto envolve decisões como comprimento permitido, quantidade de caracteres significativos e diferenciação entre maiúsculas e minúsculas; nomes muito curtos podem ser pouco representativos.","Quando os nomes são case sensitive, diferenças entre letras maiúsculas e minúsculas distinguem identificadores. Essa escolha pode prejudicar a legibilidade porque nomes visualmente parecidos passam a representar entidades diferentes."],"prompt":"Qual opção descreve melhor “Atributos das variáveis”?"},{"correctIndex":2,"feedback":"Apelidos: Dois nomes são apelidos quando podem acessar o mesmo local de memória. Ponteiros, referências e uniões podem criar apelidos; seu uso pode reduzir a legibilidade porque é necessário considerar todos os nomes que alcançam a mesma posição. Objetivos relacionados: Caracterizar uma variável por nome, endereço, valor, tipo, tempo de vida e escopo.","id":"question-apelidos","objectiveLabels":["Caracterizar uma variável por nome, endereço, valor, tipo, tempo de vida e escopo."],"options":["Desconsiderar o contexto e repetir somente uma palavra da definição.","Substituir o conceito por qualquer outro sem comparar seus significados.","Relacionar Apelidos às consequências observáveis, pois dois nomes são apelidos quando podem acessar o mesmo local de memória. Ponteiros, referências e uniões podem criar apelidos; seu uso pode reduzir a legibilidade porque é necessário considerar todos os nomes que alcançam a mesma posição.","Usar o nome do conceito como resposta sem explicar suas consequências."],"prompt":"Ao analisar um exemplo da aula, como “Apelidos” deve orientar a explicação?"},{"correctIndex":3,"feedback":"A afirmação errada reduz Vinculação a memorização. Na aula, vinculação é uma associação entre um atributo e uma entidade, como a associação de uma variável a seu tipo ou valor, ou de uma operação a seu símbolo. Tempo de vinculação é o momento em que essa associação ocorre.","id":"question-vinculacao","objectiveLabels":["Explicar vinculação, tempo de vinculação e a diferença entre vinculação estática e dinâmica."],"options":["Vinculação é uma associação entre um atributo e uma entidade, como a associação de uma variável a seu tipo ou valor, ou de uma operação a seu símbolo. Tempo de vinculação é o momento em que essa associação ocorre.","O conceito pode ser relacionado aos objetivos e a exemplos da aula.","Uma explicação adequada distingue o conceito de ideias próximas.","Basta memorizar o nome do conceito; contexto, objetivos e consequências não alteram sua análise."],"prompt":"Sobre “Vinculação”, é errado afirmar que:"},{"correctIndex":0,"feedback":"Tempos de vinculação: Uma vinculação pode ocorrer no projeto da linguagem, na implementação da linguagem, na compilação, na carga ou na execução. Exemplos incluem associar um símbolo a uma operação no projeto, um tipo a uma faixa de representação na implementação, uma variável a um tipo na compilação e uma variável a uma posição de memória na carga ou na execução. Objetivos relacionados: Explicar vinculação, tempo de vinculação e a diferença entre vinculação estática e dinâmica.","id":"question-tempos_vinculacao","objectiveLabels":["Explicar vinculação, tempo de vinculação e a diferença entre vinculação estática e dinâmica."],"options":["Definir Tempos de vinculação, aplicá-lo a um exemplo e justificar a análise: Uma vinculação pode ocorrer no projeto da linguagem, na implementação da linguagem, na compilação, na carga ou na execução. Exemplos incluem associar um símbolo a uma operação no projeto, um tipo a uma faixa de representação na implementação, uma variável a um tipo na compilação e uma variável a uma posição de memória na carga ou na execução.","Misturar conceitos diferentes e observar apenas a conclusão final.","Escolher um exemplo sem explicar sua relação com o conceito.","Memorizar a definição e dispensar exemplos ou justificativas."],"prompt":"Qual procedimento demonstra melhor a compreensão de “Tempos de vinculação”?"},{"correctIndex":1,"feedback":"No cenário apresentado, o conceito central é Vinculação estática e dinâmica. A vinculação estática ocorre pela primeira vez antes da execução e permanece inalterada durante o programa. A vinculação dinâmica ocorre pela primeira vez durante a execução ou pode ser modificada no decorrer dela.","id":"question-vinculacao_estatica_dinamica","objectiveLabels":["Explicar vinculação, tempo de vinculação e a diferença entre vinculação estática e dinâmica.","Comparar declaração explícita, declaração implícita, inferência de tipo e vinculação de tipos dinâmica."],"options":["Linguagens imperativas e arquitetura de von Neumann","Vinculação estática e dinâmica","Nomes","Case sensitive"],"prompt":"Para relacionar teoria e prática, qual conceito corresponde a esta descrição: “A vinculação estática ocorre pela primeira vez antes da execução e permanece inalterada durante o programa. A vinculação dinâmica ocorre pela primeira vez durante a execução ou pode ser modificada no decorrer dela.”?"},{"correctIndex":2,"feedback":"Declaração Explícita/Implícita: A declaração explícita lista nomes de variáveis e especifica seus tipos. A declaração implícita associa variáveis a tipos por convenções da linguagem, sem uma sentença explícita de declaração. A declaração implícita favorece a capacidade de escrita, mas pode reduzir a confiabilidade. Objetivos relacionados: Comparar declaração explícita, declaração implícita, inferência de tipo e vinculação de tipos dinâmica.","id":"question-declaracao_explicita_implicita","objectiveLabels":["Comparar declaração explícita, declaração implícita, inferência de tipo e vinculação de tipos dinâmica."],"options":["Linguagens imperativas podem ser compreendidas como abstrações de uma arquitetura formada por memória e processador. Nesse contexto, variáveis abstraem o armazenamento manipulado pelas operações do programa.","Nomes identificam entidades de um programa. Seu projeto envolve decisões como comprimento permitido, quantidade de caracteres significativos e diferenciação entre maiúsculas e minúsculas; nomes muito curtos podem ser pouco representativos.","A declaração explícita lista nomes de variáveis e especifica seus tipos. A declaração implícita associa variáveis a tipos por convenções da linguagem, sem uma sentença explícita de declaração. A declaração implícita favorece a capacidade de escrita, mas pode reduzir a confiabilidade.","Quando os nomes são case sensitive, diferenças entre letras maiúsculas e minúsculas distinguem identificadores. Essa escolha pode prejudicar a legibilidade porque nomes visualmente parecidos passam a representar entidades diferentes."],"prompt":"Qual opção descreve melhor “Declaração Explícita/Implícita”?"},{"correctIndex":3,"feedback":"Inferência de tipo: Na inferência de tipo, a linguagem determina o tipo a partir do valor inicial ou do contexto em que a variável aparece. Embora o tipo seja inferido, ele pode permanecer estaticamente vinculado. Objetivos relacionados: Comparar declaração explícita, declaração implícita, inferência de tipo e vinculação de tipos dinâmica.","id":"question-inferencia_tipo","objectiveLabels":["Comparar declaração explícita, declaração implícita, inferência de tipo e vinculação de tipos dinâmica."],"options":["Desconsiderar o contexto e repetir somente uma palavra da definição.","Substituir o conceito por qualquer outro sem comparar seus significados.","Usar o nome do conceito como resposta sem explicar suas consequências.","Relacionar Inferência de tipo às consequências observáveis, pois na inferência de tipo, a linguagem determina o tipo a partir do valor inicial ou do contexto em que a variável aparece. Embora o tipo seja inferido, ele pode permanecer estaticamente vinculado."],"prompt":"Ao analisar um exemplo da aula, como “Inferência de tipo” deve orientar a explicação?"},{"correctIndex":0,"feedback":"A afirmação errada reduz Vinculação de Tipos Dinâmica a memorização. Na aula, na vinculação de tipos dinâmica, uma atribuição vincula a variável ao tipo do valor atribuído, e essa vinculação pode mudar durante a execução. A abordagem oferece flexibilidade, mas aumenta os custos de execução e dificulta a detecção de erros de tipo pelo compilador.","id":"question-vinculacao_tipos_dinamica","objectiveLabels":["Explicar vinculação, tempo de vinculação e a diferença entre vinculação estática e dinâmica.","Comparar declaração explícita, declaração implícita, inferência de tipo e vinculação de tipos dinâmica."],"options":["Basta memorizar o nome do conceito; contexto, objetivos e consequências não alteram sua análise.","Na vinculação de tipos dinâmica, uma atribuição vincula a variável ao tipo do valor atribuído, e essa vinculação pode mudar durante a execução. A abordagem oferece flexibilidade, mas aumenta os custos de execução e dificulta a detecção de erros de tipo pelo compilador.","O conceito pode ser relacionado aos objetivos e a exemplos da aula.","Uma explicação adequada distingue o conceito de ideias próximas."],"prompt":"Sobre “Vinculação de Tipos Dinâmica”, é errado afirmar que:"},{"correctIndex":1,"feedback":"Vinculações de armazenamento e tempo de vida: Alocação é a obtenção de memória disponível, enquanto desalocação ou liberação devolve essa memória. O tempo de vida de uma variável é o período durante o qual ela permanece vinculada a uma posição específica de memória. Objetivos relacionados: Explicar alocação, desalocação e as categorias de variáveis segundo o tempo de vida.; Distinguir escopo de tempo de vida.","id":"question-alocacao_tempo_vida","objectiveLabels":["Explicar alocação, desalocação e as categorias de variáveis segundo o tempo de vida.","Distinguir escopo de tempo de vida."],"options":["Misturar conceitos diferentes e observar apenas a conclusão final.","Definir Vinculações de armazenamento e tempo de vida, aplicá-lo a um exemplo e justificar a análise: Alocação é a obtenção de memória disponível, enquanto desalocação ou liberação devolve essa memória. O tempo de vida de uma variável é o período durante o qual ela permanece vinculada a uma posição específica de memória.","Escolher um exemplo sem explicar sua relação com o conceito.","Memorizar a definição e dispensar exemplos ou justificativas."],"prompt":"Qual procedimento demonstra melhor a compreensão de “Vinculações de armazenamento e tempo de vida”?"}],"title":"Nomes, Vinculações e Escopo — Quiz 1 de 2"}</script>
  <script>
    const data = JSON.parse(document.getElementById("quiz-data").textContent);
    const form = document.getElementById("quiz");
    data.questions.forEach((question, questionIndex) => {
      const section = document.createElement("section");
      section.className = "question";
      const title = document.createElement("h2");
      title.textContent = `${questionIndex + 1}. ${question.prompt}`;
      section.appendChild(title);
      const objective = document.createElement("p");
      objective.className = "objective";
      objective.textContent = `Objetivos: ${question.objectiveLabels.join(" ")}`;
      section.appendChild(objective);
      question.options.forEach((option, optionIndex) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = question.id;
        input.value = optionIndex;
        label.append(input, ` ${option}`);
        section.appendChild(label);
      });
      const feedback = document.createElement("p");
      feedback.className = "feedback";
      feedback.hidden = true;
      feedback.dataset.for = question.id;
      section.appendChild(feedback);
      form.appendChild(section);
    });
    document.getElementById("check").addEventListener("click", () => {
      let score = 0;
      data.questions.forEach((question) => {
        const selected = form.querySelector(`input[name="${question.id}"]:checked`);
        const correct = selected && Number(selected.value) === question.correctIndex;
        if (correct) score += 1;
        form.querySelectorAll(`input[name="${question.id}"]`).forEach(
          (input, optionIndex) => {
            const label = input.closest("label");
            label.classList.toggle(
              "answer-correct",
              optionIndex === question.correctIndex
            );
            label.classList.toggle(
              "answer-incorrect",
              input.checked && optionIndex !== question.correctIndex
            );
          }
        );
        const feedback = form.querySelector(`[data-for="${question.id}"]`);
        feedback.hidden = false;
        feedback.textContent = `${correct ? "Correto." : "Revise."} ${question.feedback}`;
      });
      document.getElementById("score").textContent =
        `Resultado: ${score} de ${data.questions.length}.`;
    });
  </script>
