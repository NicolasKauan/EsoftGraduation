  <script id="quiz-data" type="application/json">{"questions":[{"correctIndex":3,"feedback":"Variáveis estáticas: Variáveis estáticas são vinculadas a uma posição de memória antes do início da execução e permanecem nessa posição durante todo o programa. Proporcionam endereçamento direto e evitam a sobrecarga de alocação e desalocação em execução, mas reduzem a flexibilidade e, se forem a única categoria disponível, impedem recursão. Objetivos relacionados: Explicar alocação, desalocação e as categorias de variáveis segundo o tempo de vida.","id":"question-variaveis_estaticas","objectiveLabels":["Explicar alocação, desalocação e as categorias de variáveis segundo o tempo de vida."],"options":["Linguagens imperativas podem ser compreendidas como abstrações de uma arquitetura formada por memória e processador. Nesse contexto, variáveis abstraem o armazenamento manipulado pelas operações do programa.","Nomes identificam entidades de um programa. Seu projeto envolve decisões como comprimento permitido, quantidade de caracteres significativos e diferenciação entre maiúsculas e minúsculas; nomes muito curtos podem ser pouco representativos.","Quando os nomes são case sensitive, diferenças entre letras maiúsculas e minúsculas distinguem identificadores. Essa escolha pode prejudicar a legibilidade porque nomes visualmente parecidos passam a representar entidades diferentes.","Variáveis estáticas são vinculadas a uma posição de memória antes do início da execução e permanecem nessa posição durante todo o programa. Proporcionam endereçamento direto e evitam a sobrecarga de alocação e desalocação em execução, mas reduzem a flexibilidade e, se forem a única categoria disponível, impedem recursão."],"prompt":"Qual opção descreve melhor “Variáveis estáticas”?"},{"correctIndex":0,"feedback":"Variáveis dinâmicas da pilha: As vinculações de armazenamento de variáveis dinâmica da pilha são criadas quando a execução alcança suas declarações. Elas permitem recursão e conservação de arma -blocos_ordem_declaracao","objectiveLabels":["Explicar escopo, visibilidade e as categorias local, não local e global.","Comparar escopo estático e escopo dinâmico, considerando busca de nomes, conveniência, legibilidade e verificação de tipos."],"options":["Blocos criam escopos estáticos internos. Dependendo da linguagem, o escopo de uma variável local pode começar em sua declaração e seguir até o final do bloco, ou abranger o bloco inteiro; variáveis declaradas em uma sentença for podem ter escopo restrito a essa sentença.","O conceito pode ser relacionado aos objetivos e a exemplos da aula.","Basta memorizar o nome do conceito; contexto, objetivos e consequências não alteram sua análise.","Uma explicação adequada distingue o conceito de ideias próximas."],"prompt":"Sobre “Blocos e ordem de declaração”, é errado afirmar que:"},{"correctIndex":3,"feedback":"Escopo global: Variáveis globais são declaradas fora das unidades locais, conforme a estrutura permitida pela linguagem. As regras para referenciá-las ou atribuir novos valores dentro de funções variam entre linguagens, como mostram os mecanismos específicos de PHP e Python. Objetivos relacionados: Explicar escopo, visibilidade e as categorias local, não local e global.","id":"question-escopo_global","objectiveLabels":["Explicar escopo, visibilidade e as categorias local, não local e global."],"options":["Misturar conceitos diferentes e observar apenas a conclusão final.","Escolher um exemplo sem explicar sua relação com o conceito.","Memorizar a definição e dispensar exemplos ou justificativas.","Definir Escopo global, aplicá-lo a um exemplo e justificar a análise: Variáveis globais são declaradas fora das unidades locais, conforme a estrutura permitida pela linguagem. As regras para referenciá-las ou atribuir novos valores dentro de funções variam entre linguagens, como mostram os mecanismos específicos de PHP e Python."],"prompt":"Qual procedimento demonstra melhor a compreensão de “Escopo global”?"},{"correctIndex":0,"feedback":"No cenário apresentado, o conceito central é Escopo dinâmico. O escopo dinâmico conecta referências a declarações pela sequência de chamadas executadas, em vez da posição textual das unidades. Ele pode ser conveniente, mas amplia a visibilidade entre subprogramas chamados e prejudica legibilidade e verificação estática de tipos.","id":"question-escopo_dinamico","objectiveLabels":["Explicar escopo, visibilidade e as categorias local, não local e global.","Comparar escopo estático e escopo dinâmico, considerando busca de nomes, conveniência, legibilidade e verificação de tipos."],"options":["Escopo dinâmico","Linguagens imperativas e arquitetura de von Neumann","Nomes","Case sensitive"],"prompt":"Em uma revisão dos conceitos, qual conceito corresponde a esta descrição: “O escopo dinâmico conecta referências a declarações pela sequência de chamadas executadas, em vez da posição textual das unidades. Ele pode ser conveniente, mas amplia a visibilidade entre subprogramas chamados e prejudica legibilidade e verificação estática de tipos.”?"},{"correctIndex":1,"feedback":"Escopo e tempo de vida: Escopo é um conceito textual ou espacial relacionado à visibilidade no código; tempo de vida é um conceito temporal relacionado ao período de vinculação ao armazenamento. Uma variável local static, por exemplo, pode ter escopo restrito à função e tempo de vida correspondente à execução completa do programa. Objetivos relacionados: Explicar alocação, desalocação e as categorias de variáveis segundo o tempo de vida.; Explicar escopo, visibilidade e as categorias local, não local e global.; Distinguir escopo de tempo de vida.","id":"question-escopo_tempo_vida","objectiveLabels":["Explicar alocação, desalocação e as categorias de variáveis segundo o tempo de vida.","Explicar escopo, visibilidade e as categorias local, não local e global.","Distinguir escopo de tempo de vida."],"options":["Linguagens imperativas podem ser compreendidas como abstrações de uma arquitetura formada por memória e processador. Nesse contexto, variáveis abstraem o armazenamento manipulado pelas operações do programa.","Escopo é um conceito textual ou espacial relacionado à visibilidade no código; tempo de vida é um conceito temporal relacionado ao período de vinculação ao armazenamento. Uma variável local static, por exemplo, pode ter escopo restrito à função e tempo de vida correspondente à execução completa do programa.","Nomes identificam entidades de um programa. Seu projeto envolve decisões como comprimento permitido, quantidade de caracteres significativos e diferenciação entre maiúsculas e minúsculas; nomes muito curtos podem ser pouco representativos.","Quando os nomes são case sensitive, diferenças entre letras maiúsculas e minúsculas distinguem identificadores. Essa escolha pode prejudicar a legibilidade porque nomes visualmente parecidos passam a representar entidades diferentes."],"prompt":"Qual opção descreve melhor “Escopo e tempo de vida”?"},{"correctIndex":2,"feedback":"Ambiente de referenciamento: O ambiente de referenciamento de uma sentença é o conjunto de todas as variáveis visíveis nessa sentença. Sua composição depende das regras de escopo aplicadas pela linguagem. Objetivos relacionados: Explicar escopo, visibilidade e as categorias local, não local e global.; Comparar escopo estático e escopo dinâmico, considerando busca de nomes, conveniência, legibilidade e verificação de tipos.; Identificar o ambiente de referenciamento de uma sentença.","id":"question-ambiente_referenciamento","objectiveLabels":["Explicar escopo, visibilidade e as categorias local, não local e global.","Comparar escopo estático e escopo dinâmico, considerando busca de nomes, conveniência, legibilidade e verificação de tipos.","Identificar o ambiente de referenciamento de uma sentença."],"options":["Desconsiderar o contexto e repetir somente uma palavra da definição.","Substituir o conceito por qualquer outro sem comparar seus significados.","Relacionar Am   <script>
    const data = JSON.parse(document.getElementById("quiz-data").textContent);
    const form = document.getElementById("quiz");
    data.questions.forEach((question, questionIndex) => {
      const section = document.createElement("section");
      section.className = "question";
      const title = document.createElement("h2");
      title.textContent = `${questionIndex + 1}. ${question.prompt}`;
      section.appendChild(title);
      const objective = document.createElement("p");
      objective.className = "objective";
      objective.textContent = `Objetivos: ${question.objectiveLabels.join(" ")}`;
      section.appendChild(objective);
      question.options.forEach((option, optionIndex) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = question.id;
        input.value = optionIndex;
        label.append(input, ` ${option}`);
        section.appendChild(label);
      });
      const feedback = document.createElement("p");
      feedback.className = "feedback";
      feedback.hidden = true;
      feedback.dataset.for = question.id;
      section.appendChild(feedback);
      form.appendChild(section);
    });
    document.getElementById("check").addEventListener("click", () => {
      let score = 0;
      data.questions.forEach((question) => {
        const selected = form.querySelector(`input[name="${question.id}"]:checked`);
        const correct = selected && Number(selected.value) === question.correctIndex;
        if (correct) score += 1;
        form.querySelectorAll(`input[name="${question.id}"]`).forEach(
          (input, optionIndex) => {
            const label = input.closest("label");
            label.classList.toggle(
              "answer-correct",
              optionIndex === question.correctIndex
            );
            label.classList.toggle(
              "answer-incorrect",
              input.checked && optionIndex !== question.correctIndex
            );
          }
        );
        const feedback = form.querySelector(`[data-for="${question.id}"]`);
        feedback.hidden = false;
        feedback.textContent = `${correct ? "Correto." : "Revise."} ${question.feedback}`;
      });
      document.getElementById("score").textContent =
        `Resultado: ${score} de ${data.questions.length}.`;
    });
  </script>
